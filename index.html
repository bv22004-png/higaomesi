<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>東大宮グルメガチャ</title>

  <style>

  body {
    font-family: sans-serif;
    background-color: #f5f5f5;
    text-align: center;
    margin: 0;
    padding: 20px;
  }

  h1 {
    color: #333;
    font-size: 32px;
    margin-top: 30px;
    margin-bottom: 10px;
  }

  p {
    font-size: 18px;
    color: #666;
  }

  button {
    background-color: #ff7f50;
    color: white;
    border: none;
    padding: 16px 28px;
    font-size: 18px;
    border-radius: 15px;
    cursor: pointer;
    margin-top: 20px;
    width: 90%;
    max-width: 300px;

    box-shadow: 0 4px 10px rgba(0,0,0,0.15);

    transition: 0.2s;
  }

  button:hover {
    opacity: 0.9;
    transform: scale(1.03);
  }

  #result {
    margin: 30px auto 0 auto;

    background-color: white;

    width: 90%;
    max-width: 350px;

    padding: 30px 20px;

    border-radius: 20px;

    box-shadow: 0 4px 15px rgba(0,0,0,0.12);
  }

  .shop-name {
    font-size: 30px;
    font-weight: bold;
    margin-bottom: 20px;
    color: #222;
  }

  .info {
    font-size: 18px;
    margin: 12px 0;
  }

  a {
    color: white;
    background-color: #0077cc;

    text-decoration: none;

    padding: 12px 20px;

    border-radius: 12px;

    display: inline-block;

    margin-top: 10px;

    transition: 0.2s;
  }

  a:hover {
    opacity: 0.85;
  }

  /* スマホ向け */

  @media screen and (max-width: 600px) {

    h1 {
      font-size: 26px;
    }

    .shop-name {
      font-size: 24px;
    }

    p {
      font-size: 16px;
    }

    button {
      font-size: 17px;
    }

  }

</style>
</head>

<body>

  <h1>東大宮グルメガチャ</h1>

  <p>ボタンを押して今日のご飯を決めよう！</p>

  <button onclick="decideShop()">
    ガチャを回す
  </button>

  <div id="result">
    <p>ここに結果が表示されます</p>
  </div>

  <script>
    const shops = [
      {
        name: "一條苑",
        info: "https://h-omiya.com/archives/shop/ichijoen"
      },

      {
        name: "らーめんランド壱番館",
        info: "https://h-omiya.com/archives/shop/ichibankan"
      },

      {
        name: "そば処　大菊",
        info: "https://h-omiya.com/archives/shop/ogiku"
      },
      {
        name: "玄海寿司",
        info: "https://h-omiya.com/archives/shop/genkaizushi"
      },

      {
        name:"インド料理 DURGA(ドゥルガ)",
        info:"https://h-omiya.com/archives/shop/durga"
      },
      
      {
        name:"そば処　巴屋",
        info:"https://h-omiya.com/archives/shop/tomoeya"
      },
      
      {
        name:"からあげ専門店 鶏笑 東大宮店",
        info:"https://h-omiya.com/archives/shop/torisho"
      },
      
      {
        name:"やきとりや NOKAOI",
        info:"https://h-omiya.com/archives/shop/nokaoi"
      },
      
      {
        name:"まどいびより 円居日和",
        info:"https://h-omiya.com/archives/shop/madoibiyori"
      },
      
    ];

    function decideShop() {

      const randomIndex = Math.floor(Math.random() * shops.length);

      const shop = shops[randomIndex];

      document.getElementById("result").innerHTML = `
        <div class="shop-name">${shop.name}</div>

        <div class="info">
          <a href="${shop.info}" target="_blank">
            お店の情報を見る
          </a>
        </div>
      `;  
    }
  </script>

</body>
</html>
